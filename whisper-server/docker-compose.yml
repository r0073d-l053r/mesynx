# Standalone WhisperX transcription server.
#
# Use this when you want transcription on a DIFFERENT machine from the app —
# a GPU box on your LAN or tailnet. The main docker-compose.yml already runs
# this service alongside the app; you do not need both.
#
#   1. Accept https://hf.co/pyannote/speaker-diarization-community-1
#   2. Put HF_TOKEN=hf_... in a .env next to this file
#   3. From the repo root, run ./patches/apply.sh once
#   4. docker compose up -d
#   5. Point Mesynx AI at http://<this-host>:8398/v1, model
#      large-v3-turbo-diarize
#
# GPU REQUIRED — there is no CPU image for WhisperX.

services:
  whisperx:
    image: ghcr.io/etalab-ia/whisperx-openai-api:latest
    container_name: mesynx-whisperx
    restart: unless-stopped
    ports:
      # Host 8398 -> container 8000.
      - "8398:8000"
    environment:
      # Must match the API key you enter in Mesynx AI → Settings → AI Providers.
      - API_KEY=${WHISPERX_API_KEY:-sk-placeholder}
      # Read-scope token from https://hf.co/settings/tokens, AFTER accepting
      # the pyannote licence. Without it the image 401s on a gated repo.
      - HF_TOKEN=${HF_TOKEN:-}
      # Append "-diarize" to the model name in Mesynx AI (e.g.
      # "large-v3-turbo-diarize") to activate speaker diarization.
      - TRANSCRIBE_MODEL=${WHISPERX_MODEL:-large-v3-turbo}
      # Dominant driver of activation memory. Measured: batch 8 overflows an
      # 8 GB card on a 17-minute file. 4 on 8 GB, 8 on 12 GB, 16+ above.
      - BATCH_SIZE=${WHISPERX_BATCH_SIZE:-4}
      # Stops fragmentation creep on long-lived containers (observed 2.6 GB ->
      # 6.5 GB over ~17 h of uptime, then OOM mid-transcription).
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Image default preloads en/fr/nl/de (~4.1 GB). English-only is ~0.4 GB;
      # other languages still load on demand for their first request.
      - PRELOADED_ALIGN_MODEL_LANGUAGES=${WHISPERX_ALIGN_LANGUAGES:-["en"]}
    # Idle with a clear message instead of crash-looping when HF_TOKEN is
    # unset — the image builds its pyannote pipeline unconditionally at
    # startup, so a missing token is a 401 on every start.
    entrypoint:
      - sh
      - -c
      - >
        if [ -z "$$HF_TOKEN" ]; then
        echo "HF_TOKEN is empty — accept https://hf.co/pyannote/speaker-diarization-community-1 and set HF_TOKEN in .env, then restart.";
        sleep infinity;
        fi;
        exec gunicorn main:app --workers $${WORKERS:-1} --worker-class uvicorn.workers.UvicornWorker --timeout 120 --bind 0.0.0.0:$${PORT:-8000}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Pin this if an LLM server shares the host, or the two will
              # contend for the same card and transcription fails with
              # CUDA OOM. Device 0 is correct on a single-GPU box.
              device_ids: [ "0" ]
              capabilities: [ gpu ]
    healthcheck:
      # This image ships no curl, so a curl check can never pass — the
      # container reports unhealthy forever and any restart-on-unhealthy
      # supervisor loops it, killing long transcriptions. /v1/models needs the
      # bearer key; /health is unauthenticated. Long start_period because the
      # first boot downloads pyannote + alignment models.
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)" ]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5
    volumes:
      # Cache downloaded Whisper + diarization models across restarts.
      - whisperx_cache:/data/models
      # Accepts "<model>-diarize" as a model alias; without it the server 404s
      # the convention the app uses to request diarization. Generate with
      # ../patches/apply.sh — see ../patches/README.md.
      - ../patches/whisperx-audio.py:/app/endpoints/audio.py:ro

volumes:
  whisperx_cache:
    driver: local
