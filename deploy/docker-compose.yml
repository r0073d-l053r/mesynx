# Mesynx AI — production docker-compose (self-hosted install)
#
# This file is published as a release asset and downloaded by the one-line
# installer (scripts/install.sh). It pulls pre-built images from GHCR rather
# than building from source.
#
# Quick start (after running the installer, or manually):
#   curl -fLO https://github.com/r0073d-l053r/mesynx/releases/latest/download/docker-compose.yml
#   curl -fL  https://github.com/r0073d-l053r/mesynx/releases/latest/download/env.example -o .env
#   # Edit .env — set BETTER_AUTH_SECRET, ENCRYPTION_KEY, and APP_URL at minimum
#   docker compose pull
#   docker compose up -d
#
# Upgrade:
#   docker compose pull && docker compose up -d
#
# GPU REQUIRED: transcription runs on WhisperX, which has no CPU image. You
# need an NVIDIA GPU with the Container Toolkit installed and configured
# (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/), plus an
# HF_TOKEN in .env after accepting the pyannote licence. There is no CPU-only
# path since the faster-whisper-server `whisper` service was removed.

services:
  db:
    image: postgres:16-alpine
    container_name: mesynx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mesynx
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mesynx-network

  app:
    # Pulls the pre-built image from GitHub Container Registry.
    # MESYNX_AI_VERSION is written to .env by the installer (e.g. "0.5.6").
    # Leave it unset or set to "latest" to always track the newest stable release.
    image: ghcr.io/r0073d-l053r/mesynx:${MESYNX_AI_VERSION:-latest}
    container_name: mesynx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8790}:3000"
    # Lets the app reach AI services running on the host (Ollama, Open WebUI,
    # whisper) via http://host.docker.internal:<port>, which powers
    # Settings → AI Providers → "Scan for Local Services". Auto-injected by
    # Docker Desktop on Windows/Mac; required explicitly on Linux. Note: the
    # host service must listen on 0.0.0.0, not just 127.0.0.1 — e.g. start
    # Ollama with OLLAMA_HOST=0.0.0.0.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mesynx

      # Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL:-http://localhost:8790}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-}

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Storage (optional — defaults to local disk under /app/audio)
      DEFAULT_STORAGE_TYPE: ${DEFAULT_STORAGE_TYPE:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/audio}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - audio:/app/audio
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    networks:
      - mesynx-network

  # WhisperX: transcription + forced alignment + speaker diarization, over an
  # OpenAI-compatible API. The only transcription service — the bundled
  # faster-whisper-server was removed 2026-08-04 (WhisperX supersedes it, and
  # running both meant two model sets competing for one card).
  #
  # GPU REQUIRED: there is no CPU image for this service. Two prerequisites:
  #   1. accept https://hf.co/pyannote/speaker-diarization-community-1
  #   2. set HF_TOKEN=hf_... (read scope) in .env
  # The entrypoint guard idles with a clear message if the token is missing,
  # rather than crash-looping on a gated-repo 401.
  whisperx:
    image: ghcr.io/etalab-ia/whisperx-openai-api:latest
    container_name: mesynx-whisperx
    restart: unless-stopped
    ports:
      - "8398:8000"
    environment:
      - API_KEY=${WHISPERX_API_KEY:-sk-placeholder}
      - HF_TOKEN=${HF_TOKEN:-}
      - TRANSCRIBE_MODEL=${WHISPERX_MODEL:-large-v3-turbo}
      # Dominant driver of activation memory. Measured: batch 8 overflows an
      # 8 GB card on a 17-minute file. Use 4 on 8 GB, 8 on 12 GB, 16+ above.
      - BATCH_SIZE=${WHISPERX_BATCH_SIZE:-4}
      # Stops fragmentation creep on long-lived containers (observed 2.6 GB →
      # 6.5 GB over ~17 h of uptime, then OOM mid-transcription).
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Image default preloads en/fr/nl/de (~4.1 GB). English-only is ~0.4 GB;
      # other languages still load on demand for their first request.
      - PRELOADED_ALIGN_MODEL_LANGUAGES=${WHISPERX_ALIGN_LANGUAGES:-["en"]}
    entrypoint:
      - sh
      - -c
      - >
        if [ -z "$$HF_TOKEN" ]; then
        echo "HF_TOKEN is empty — accept https://hf.co/pyannote/speaker-diarization-community-1 and set HF_TOKEN in .env, then restart.";
        sleep infinity;
        fi;
        exec gunicorn main:app --workers $${WORKERS:-1} --worker-class uvicorn.workers.UvicornWorker --timeout 120 --bind 0.0.0.0:$${PORT:-8000}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Pinned to device 0 so a resident LLM on another card cannot
              # contend for the same GPU. Correct on single-GPU hosts too.
              device_ids: [ "0" ]
              capabilities: [ gpu ]
    healthcheck:
      # This image ships no curl, so a curl check can never pass — the
      # container reports unhealthy forever and any restart-on-unhealthy
      # supervisor loops it, killing long transcriptions. /v1/models needs the
      # bearer key; /health is unauthenticated. Long start_period because the
      # first boot downloads pyannote + alignment models.
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)" ]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5
    volumes:
      - whisperx_cache:/data/models
      # Accepts "<model>-diarize" as a model alias; without it the server 404s
      # the very convention the app uses to request diarization. install.sh
      # fetches this file; otherwise run patches/apply.sh from the repo.
      - ./patches/whisperx-audio.py:/app/endpoints/audio.py:ro
    networks:
      - mesynx-network

volumes:
  pgdata:
    driver: local
  audio:
    driver: local
  # `whisper_cache` was dropped with the whisper service. Any existing volume
  # is left on disk so an upgrade never destroys downloaded models; reclaim it
  # with `docker volume rm <project>_whisper_cache`.
  whisperx_cache:
    driver: local

networks:
  mesynx-network:
    driver: bridge
