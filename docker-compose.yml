services:
  db:
    image: postgres:16-alpine
    container_name: mesynx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Default preserved for backward compat with existing self-host
      # deploys. The one-line installer (scripts/install.sh) generates a
      # random POSTGRES_PASSWORD and writes it to .env. Existing operators
      # can rotate by setting POSTGRES_PASSWORD in .env, recreating the
      # `db` volume, and restoring from a backup.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mesynx-ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mesynx-network

  app:
    # Build from local source code
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/r0073d-l053r/mesynx:${MESYNX_AI_VERSION:-dev}
    container_name: mesynx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8790}:3000"
    # Lets the app reach AI services running on the host (Ollama, Open WebUI,
    # whisper) via http://host.docker.internal:<port>, which powers
    # Settings → AI Providers → "Scan for Local Services". Auto-injected by
    # Docker Desktop on Windows/Mac; required explicitly on Linux. Note: the
    # host service must listen on 0.0.0.0, not just 127.0.0.1 — e.g. start
    # Ollama with OLLAMA_HOST=0.0.0.0.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mesynx-ai

      # Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL:-http://localhost:8790}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-}

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Storage (optional defaults)
      DEFAULT_STORAGE_TYPE: ${DEFAULT_STORAGE_TYPE:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/audio}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - audio:/app/audio
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    networks:
      - mesynx-network

  # WhisperX: transcription + forced alignment + speaker diarization over an
  # OpenAI-compatible API. This is now the ONLY transcription service — the
  # legacy fedirz/faster-whisper-server was removed 2026-08-04 because
  # whisperx supersedes it and the two competed for the same 8 GB GPU.
  # Prereqs (both required, or it crash-loops on a gated-repo 401 like the
  # ~3,091-restart loop that got it removed the first time):
  #   1. accept https://hf.co/pyannote/speaker-diarization-community-1
  #   2. set HF_TOKEN=hf_... (read scope) in .env
  # The entrypoint guard below refuses to boot without HF_TOKEN and idles
  # instead of crash-looping.
  whisperx:
    image: ghcr.io/etalab-ia/whisperx-openai-api:latest
    container_name: mesynx-whisperx
    restart: unless-stopped
    ports:
      - "8398:8000"
    environment:
      # Must match the API key entered in Mesynx AI -> Settings -> AI Providers.
      - API_KEY=${WHISPERX_API_KEY:-sk-placeholder}
      # Read-scope token from https://hf.co/settings/tokens, AFTER accepting
      # the pyannote licence (see block comment above).
      - HF_TOKEN=${HF_TOKEN:-}
      - TRANSCRIBE_MODEL=${WHISPERX_MODEL:-large-v3-turbo}
      # Image default is 32 — far too high for these GPUs. Measured: the
      # resident model set alone occupies ~6.5 GB of GPU0's 8 GB, so
      # activation memory has to fit in the remaining ~1.5 GB. Batch 8
      # overflowed that on a 17-minute file (CUDA out of memory); 4 leaves
      # headroom. Lower further if longer recordings still fail.
      - BATCH_SIZE=${WHISPERX_BATCH_SIZE:-4}
      # Let the allocator grow segments instead of reserving fixed pools —
      # markedly reduces fragmentation-driven OOM on a nearly-full GPU.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Image default preloads en/fr/nl/de align models (~4.1 GB resident).
      # English-only cuts that to ~0.4 GB; other languages still work, their
      # align model just loads on demand per request.
      - PRELOADED_ALIGN_MODEL_LANGUAGES=["en"]
    # Guard: refuse to boot without HF_TOKEN, idling (not crash-looping) so a
    # misconfigured start is obvious in `docker ps` + logs instead of hammering
    # the docker daemon. Mirrors the image ENTRYPOINT (Dockerfile:78) otherwise.
    entrypoint:
      - sh
      - -c
      - >
        if [ -z "$$HF_TOKEN" ]; then
        echo "HF_TOKEN is empty — accept https://hf.co/pyannote/speaker-diarization-community-1 and set HF_TOKEN in .env, then restart.";
        sleep infinity;
        fi;
        exec gunicorn main:app --workers $${WORKERS:-1} --worker-class uvicorn.workers.UvicornWorker --timeout 120 --bind 0.0.0.0:$${PORT:-8000}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # GPU0 alongside whisper: resident ~3.5-4.5 GB (turbo model +
              # pyannote + en align) fits the 2070 SUPER when whisper's
              # lazy-loaded model is evicted; both never serve simultaneously
              # for the same recording. GPU1 belongs to ollama.
              device_ids: [ "0" ]
              capabilities: [ gpu ]
    healthcheck:
      # No curl in this image, and /v1/models requires bearer auth — /health
      # is the unauthenticated monitoring route. Long start_period: first boot
      # downloads pyannote + align models (~1-2 GB).
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)" ]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5
    volumes:
      # Model cache survives recreates (volume still holds 1.6 GB from the
      # previous install).
      - whisperx_cache:/data/models
      # PATCH: accept "<model>-diarize" as a model alias — the mesynx app
      # signals diarization via the "-diarize" suffix but the stock server
      # 404s any model name it doesn't recognize verbatim. Original code in
      # the image; patch is a copy of endpoints/audio.py with one check
      # loosened (see patches/whisperx-audio.py).
      - ./patches/whisperx-audio.py:/app/endpoints/audio.py:ro
    networks:
      - mesynx-network

volumes:
  pgdata:
    driver: local
  audio:
    driver: local
  whisperx_cache:
    driver: local

networks:
  mesynx-network:
    driver: bridge
